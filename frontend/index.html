<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#123524" />
    <script>
      (function () {
        var theme = 'light';
        try {
          var saved = window.localStorage.getItem('nest-theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch (_) {
          /* Storage can be blocked; keep the reviewed light default. */
        }
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name=theme-color]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#091410' : '#123524');
      })();
    </script>
    <link
      rel="preload"
      href="/fonts/fraunces-latin-700-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/figtree-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%BA%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
