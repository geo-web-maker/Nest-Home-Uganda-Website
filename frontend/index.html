<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B2E2A" />
    <script>
      (function () {
        var theme = 'light';
        try {
          var saved = window.localStorage.getItem('nest-theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch (_) {
          /* Storage can be blocked; keep the reviewed light default. */
        }
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name=theme-color]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#071F1C' : '#0B2E2A');
      })();
    </script>
    <link
      rel="preload"
      href="/fonts/fraunces-latin-700-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/figtree-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
