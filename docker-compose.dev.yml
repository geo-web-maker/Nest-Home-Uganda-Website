# Local development and test services. Not for production.
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }; if (!db.hello().isWritablePrimary) quit(1)"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s
    volumes: ["mongo-data:/data/db"]

  # Optional local-only scanner profile. Do not use the HTTP endpoint outside
  # the developer machine; production must deploy scanner/docker-compose.yml
  # behind HTTPS on a separate, monitored host.
  clamav:
    image: clamav/clamav:stable
    profiles: ["scanner"]
    restart: unless-stopped
    mem_limit: 4g
    volumes: ["clamav-signatures:/var/lib/clamav"]
    expose: ["3310"]
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1"]
      interval: 60s
      timeout: 10s
      retries: 5

  scanner:
    profiles: ["scanner"]
    build: ./scanner
    restart: unless-stopped
    environment:
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      SCAN_BEARER_TOKEN: ${SCAN_BEARER_TOKEN:-}
      NEST_S3_ENDPOINT: ${NEST_S3_ENDPOINT:-}
      NEST_S3_REGION: ${NEST_S3_REGION:-auto}
      NEST_S3_BUCKET_MAIL: ${NEST_S3_BUCKET_MAIL:-}
      NEST_S3_READ_KEY: ${NEST_S3_READ_KEY:-}
      NEST_S3_READ_SECRET: ${NEST_S3_READ_SECRET:-}
      SCAN_MAX_BYTES: ${SCAN_MAX_BYTES:-26214400}
    depends_on:
      clamav:
        condition: service_healthy
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
  clamav-signatures:
