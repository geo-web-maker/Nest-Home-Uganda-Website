<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#0B2E2A" />
    <script>
      (function () {
        var theme = 'light';
        try { var saved = window.localStorage.getItem('nest-theme'); if (saved === 'light' || saved === 'dark') theme = saved; } catch (_) {}
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name=theme-color]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#071F1C' : '#0B2E2A');
      })();
    </script>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <title>Bloomwell Home Care Uganda Admin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
