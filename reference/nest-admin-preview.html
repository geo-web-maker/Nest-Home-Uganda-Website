<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nest Home Care: Admin Panel Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--pbg:#E4EBE0;--gold:#C79A3B;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pbg:#08120D}}
:root[data-theme="dark"]{--pbg:#08120D}
html,body{margin:0;height:100%}
body{background:var(--pbg);font:500 15px/1.4 "Figtree",system-ui,sans-serif;display:flex;flex-direction:column}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{background:#123524;color:#F4F1DF;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:center}
.bar h1{font:700 1rem "Fraunces",Georgia,serif;margin:0;flex:1 1 100%;text-align:center}
.grp{display:flex;gap:4px;background:rgba(255,255,255,.1);padding:3px;border-radius:999px}
.grp button{border:0;background:transparent;color:inherit;min-height:38px;padding:0 14px;border-radius:999px;font:600 .88rem "Figtree",sans-serif;cursor:pointer}
.grp button[aria-pressed="true"]{background:var(--gold);color:#1B1706}
.bar select{min-height:42px;border-radius:999px;border:0;padding:0 14px;font:600 .9rem "Figtree",sans-serif;background:#F4F1DF;color:#123524}
.stage{flex:1;min-height:0;padding:12px;overflow:hidden}.wrapf{margin:0 auto}
.frame{transform-origin:top left;border:7px solid #0E1A13;border-radius:26px;overflow:hidden;background:#fff;box-shadow:0 14px 40px rgba(0,0,0,.28)}
.adm{--bg:#F3F8F1;--mint:#DFF0E6;--surf:#fff;--ink:#123524;--mut:#4A6354;--forest:#123524;--leaf:#1F8A5B;--moss:#2F6B4A;--gold:#C79A3B;--line:#CBD8C6;--onf:#F4F1DF;--serif:"Fraunces",Georgia,serif;--sans:"Figtree",system-ui,sans-serif;
 container-type:inline-size;height:100%;display:grid;grid-template-rows:1fr auto;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans)}
.adm h1,.adm h2,.adm h3{font-family:var(--serif);margin:0;line-height:1.15}.adm p{margin:0}
.sb{display:none;background:var(--forest);color:var(--onf);flex-direction:column;padding:14px 10px;gap:2px;overflow:auto}
.sb .lg{display:flex;align-items:center;gap:8px;padding:6px 8px 16px;font:700 .95rem/1.1 var(--serif)}.sb .lg small{display:block;font:500 .66rem var(--sans);color:var(--gold)}
.sb button,.bn button{display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;font:600 .9rem var(--sans);min-height:44px;padding:0 12px;border-radius:12px;cursor:pointer;text-align:left;width:100%}
.sb button:hover{background:rgba(255,255,255,.08)}.sb button[aria-current="true"]{background:var(--gold);color:#1B1706}
.sb svg,.bn svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sb .gp{font:700 .68rem var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);padding:14px 12px 4px}
.mc{overflow:auto;min-height:0}
.top{position:sticky;top:0;z-index:5;background:var(--surf);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:58px;gap:10px}
.top b{font:700 1.1rem var(--serif)}.av{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--mut)}.av i{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#1B1706;display:grid;place-items:center;font:700 .85rem var(--sans);font-style:normal}
.pgc{padding:18px 16px 28px;max-width:1200px;margin:0 auto}
.bn{display:flex;background:var(--forest);color:var(--onf);padding:4px 4px calc(4px)}
.bn button{flex-direction:column;gap:2px;font-size:.68rem;min-height:54px;padding:4px 2px;justify-content:center;text-align:center}.bn button[aria-current="true"]{color:var(--gold)}
.hd{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}.hd h2{font-size:1.5rem}.hd p{color:var(--mut);font-size:.9rem}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 18px;border-radius:999px;border:2px solid var(--gold);background:var(--gold);color:#1B1706;font:700 .9rem var(--sans);cursor:pointer;text-decoration:none}
.btn.o{background:transparent;color:var(--ink);border-color:var(--line)}.btn.g{background:#25D366;border-color:#25D366;color:#06260F}.btn.s{min-height:34px;padding:0 12px;font-size:.82rem}
.btn.d{background:transparent;color:#B3261E;border-color:#E8B7B3}
.cards{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-bottom:16px}
.st{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:14px}.st b{display:block;font:700 1.8rem var(--serif)}.st span{color:var(--mut);font-size:.82rem}.st.h{border-color:var(--gold);border-width:2px}
.box{background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.box h3{font-size:1.1rem;margin-bottom:10px}
.two{display:grid;gap:14px}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:14px;padding-bottom:4px}
.tabs button{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--surf);font:600 .85rem var(--sans);color:var(--ink);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:var(--onf)}
.tb{width:100%;border-collapse:collapse;display:block}.tb thead{display:none}.tb tbody,.tb tr,.tb td{display:block}
.tb tr{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.tb td{padding:2px 0;font-size:.9rem}.tb td::before{content:attr(data-l)": ";color:var(--mut);font-size:.78rem}.tb td:first-child{font-weight:700;font-size:1rem}.tb td:first-child::before{content:""}
.bd{display:inline-block;padding:3px 10px;border-radius:999px;font:700 .72rem var(--sans);background:#E3EEE6;color:#1B5E3B}
.bd.n{background:#FFF1CC;color:#7A5A00}.bd.r{background:#EDE6F7;color:#4B2E83}.bd.x{background:#F4E1DF;color:#8A2C24}.bd.b{background:#DCEBFA;color:#1B4F8A}
.f{display:grid;gap:12px}.f label{display:block;font-weight:600;font-size:.84rem;margin-bottom:4px}.f small{color:var(--mut);font-weight:400}
.f input,.f select,.f textarea{width:100%;min-height:44px;border:2px solid var(--line);border-radius:12px;padding:0 12px;font:400 .95rem var(--sans);background:var(--bg);color:var(--ink)}
.f textarea{min-height:84px;padding:10px 12px}.f input[type=color]{padding:3px;min-height:44px}.f input[type=checkbox]{width:20px;min-height:20px}
.g2{display:grid;gap:12px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.sw:last-child{border:0}
.sw button{flex:none;width:48px;height:28px;border-radius:99px;border:0;background:#C9D2CB;position:relative;cursor:pointer}.sw button::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw button[aria-pressed="true"]{background:var(--leaf)}.sw button[aria-pressed="true"]::after{left:23px}
.ch{display:flex;flex-wrap:wrap;gap:8px}.ch span{display:inline-flex;align-items:center;gap:8px;padding:7px 8px 7px 14px;border-radius:99px;border:2px solid var(--line);background:var(--surf);font-size:.88rem}.ch span i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--mut)}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px}.bars div{flex:1;background:var(--leaf);border-radius:8px 8px 3px 3px;position:relative}.bars div:last-child{background:var(--gold)}.bars span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:.7rem;color:var(--mut)}
.tl{list-style:none;margin:0;padding:0}.tl li{padding:8px 0 8px 18px;border-left:2px solid var(--gold);margin-left:6px;position:relative;font-size:.9rem}.tl li small{display:block;color:var(--mut)}
.mg{display:grid;gap:10px;grid-template-columns:1fr 1fr}.mg div{aspect-ratio:1;border-radius:14px;background:repeating-linear-gradient(135deg,#E9DDB8 0 8px,#fff 8px 16px);border:1px solid var(--line);display:grid;place-items:end start;padding:8px;font-size:.72rem;color:var(--mut)}
.login{display:grid;place-items:center;min-height:100%;background:var(--forest);padding:24px}.login .bx{background:var(--surf);border-radius:28px;padding:28px 24px;width:min(400px,100%);border:1px solid var(--gold)}
.mx{width:100%;border-collapse:collapse;font-size:.85rem;display:block;overflow:auto}.mx th,.mx td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}.mx th:first-child,.mx td:first-child{text-align:left}
.pg{display:none}
@container (min-width:700px){
 .adm{grid-template-rows:1fr;grid-template-columns:76px 1fr}.sb{display:flex}.bn{display:none}
 .sb .lg span,.sb button span,.sb .gp{display:none}.sb button{justify-content:center;padding:0}.sb .lg{justify-content:center}
 .pgc{padding:24px 28px 36px}.cards{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr 1fr}.mg{grid-template-columns:repeat(3,1fr)}
}
@container (min-width:1040px){
 .adm{grid-template-columns:244px 1fr}.sb .lg span,.sb button span,.sb .gp{display:block}.sb button{justify-content:flex-start;padding:0 12px}.sb .lg{justify-content:flex-start}
 .tb{display:table}.tb thead{display:table-header-group}.tb tbody{display:table-row-group}.tb tr{display:table-row;background:none;border:0;border-radius:0;padding:0;margin:0}.tb td,.tb th{display:table-cell;padding:12px 12px;border-bottom:1px solid var(--line);font-size:.9rem;text-align:left}.tb td::before{display:none}.tb td:first-child{font-size:.9rem}
 .tb th{font:700 .72rem var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}.tb tbody tr:hover{background:var(--mint)}.tbw{background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:6px 10px}
 .two.w{grid-template-columns:1.4fr 1fr}.mg{grid-template-columns:repeat(5,1fr)}.cards{gap:14px}
}
</style>
</head>
<body>
<div class="bar" id="bar">
  <h1>Nest Home Care Uganda: admin panel preview</h1>
  <select id="sel" aria-label="Admin page"></select>
  <div class="grp" id="gv" role="group" aria-label="Device"><button data-w="375" aria-pressed="true">Phone</button><button data-w="820" aria-pressed="false">Tablet</button><button data-w="1280" aria-pressed="false">Desktop</button></div>
</div>
<div class="stage" id="stage"><div class="wrapf" id="wf"><div class="frame" id="fr"><div class="adm" id="adm"></div></div></div></div>
<script>
const $=id=>document.getElementById(id);
const IC={dash:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',enq:'<path d="M3 6h18v12H3zM3 7l9 7 9-7"/>',job:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V4h6v3M3 13h18"/>',app:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.500-6 8-6s8 2 8 6"/>',con:'<path d="M5 3h10l4 4v14H5zM14 3v5h5M8 13h8M8 17h6"/>',set:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',usr:'<circle cx="9" cy="8" r="3.500"/><path d="M2 20c0-3.500 3-5.500 7-5.500s7 2 7 5.500M17 4a3.500 3.500 0 010 7M22 20c0-3-2-5-5-5.500"/>',rep:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',log:'<path d="M4 6h16M4 12h16M4 18h10"/>',more:'<circle cx="5" cy="12" r="1.500"/><circle cx="12" cy="12" r="1.500"/><circle cx="19" cy="12" r="1.500"/>'};
const ico=k=>'<svg viewBox="0 0 24 24">'+IC[k]+'</svg>';
const NAV=[["dash","Dashboard","dash"],["enq","Enquiries","enq"],["job","Careers","job"],["app","Applications","app"],["con","Content","con"],["set","Site settings","set"],["usr","Users and roles","usr"],["rep","Reports","rep"],["log","Activity log","log"]];
const PAGES=[["login","Login"],["dash","Dashboard"],["enq","Enquiries list"],["enqd","Enquiry detail"],["job","Careers: jobs"],["jobe","Job editor"],["app","Applications"],["con","Content manager"],["set","Site settings (variables)"],["usr","Users and roles"],["rep","Reports"],["log","Activity log"],["more","More menu (phone)"]];
const SV=["Elderly and companion care","Postnatal and newborn care","Wound care and medication","Physiotherapy at home","Palliative and respite care","Chronic disease management","Pediatric home nursing","Hospital to home transition"];
const bd=(t,c)=>'<span class="bd '+(c||'')+'">'+t+'</span>';
const sc={New:'n',Contacted:'b','Assessment booked':'r','Care started':'','Not proceeding':'x'};
const inp=(l,v,t,h)=>'<div><label>'+l+(h?' <small>'+h+'</small>':'')+'</label><input type="'+(t||'text')+'" value="'+(v||'')+'"></div>';
const ta=(l,v,h)=>'<div><label>'+l+(h?' <small>'+h+'</small>':'')+'</label><textarea>'+(v||'')+'</textarea></div>';
const sl=(l,o,s)=>'<div><label>'+l+'</label><select>'+o.map(x=>'<option'+(x===s?' selected':'')+'>'+x+'</option>').join('')+'</select></div>';
const sw=(l,on,h)=>'<div class="sw"><div>'+l+(h?'<br><small style="color:var(--mut)">'+h+'</small>':'')+'</div><button aria-pressed="'+!!on+'" aria-label="'+l+'"></button></div>';
const chips=a=>'<div class="ch">'+a.map(x=>'<span>'+x+'<i>×</i></span>').join('')+'<button class="btn o s" type="button">+ Add</button></div>';
const hd=(t,p,a)=>'<div class="hd"><div><h2>'+t+'</h2>'+(p?'<p>'+p+'</p>':'')+'</div>'+(a||'')+'</div>';
const tabs=(id,a,cur)=>'<div class="tabs" data-tabs="'+id+'">'+a.map((x,i)=>'<button type="button" aria-pressed="'+(i===0)+'" data-tab="'+i+'">'+x+'</button>').join('')+'</div>';
const table=(cols,rows,go)=>'<div class="tbw"><table class="tb"><thead><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr'+(go?' data-go="'+go+'"':'')+'>'+r.map((c,i)=>'<td data-l="'+cols[i]+'">'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
const E=[["Sarah Namukasa","0772 123 456","Postnatal and newborn care","Ntinda","New","Today 09:12","Unassigned"],["James Okello","0701 654 321","Elderly and companion care","Kololo","Contacted","Today 08:40","Grace"],["Mary Atim","0782 445 100","Wound care and medication","Muyenga","Assessment booked","Yesterday","Grace"],["Peter Ssemwogerere","0752 908 777","Chronic disease management","Bugolobi","Care started","2 days ago","Ruth"],["Agnes Nabirye","0774 300 220","Hospital to home transition","Kisaasi","New","2 days ago","Unassigned"],["David Mugisha","0700 118 429","Palliative and respite care","Makindye","Not proceeding","4 days ago","Ruth"]];
const V={
login:()=>'<div class="login"><div class="bx"><h2 style="font-size:1.6rem">Nest Home Care</h2><p style="color:var(--mut);margin:4px 0 18px">Staff sign in</p><div class="f">'+inp('Email','grace@nesthomecare.ug','email')+inp('Password','••••••••','password')+'<button class="btn" data-go="dash">Sign in</button><p style="text-align:center;font-size:.85rem;color:var(--mut)">Forgot password? · Two-step verification on for managers</p></div></div></div>',
dash:()=>hd('Good morning, Grace','Here is what needs attention today.','<button class="btn" data-go="enq">View enquiries</button>')+'<div class="cards"><div class="st h"><b>12</b><span>New enquiries this week</span></div><div class="st h"><b>3</b><span>Unanswered over 30 min</span></div><div class="st"><b>8</b><span>Applications waiting</span></div><div class="st"><b>5</b><span>Care started this month</span></div></div><div class="two w"><div class="box"><h3>Enquiries per day</h3><div class="bars" style="margin-bottom:26px"><div style="height:45%"><span>Mon</span></div><div style="height:70%"><span>Tue</span></div><div style="height:55%"><span>Wed</span></div><div style="height:90%"><span>Thu</span></div><div style="height:60%"><span>Fri</span></div><div style="height:35%"><span>Sat</span></div><div style="height:75%"><span>Today</span></div></div><p style="color:var(--mut);font-size:.88rem">Sources: form 58% · WhatsApp 31% · call 11%</p></div><div class="box"><h3>Needs a reply</h3>'+E.filter(e=>e[4]==="New").map(e=>'<div class="sw" data-go="enqd" style="cursor:pointer"><div><b>'+e[0]+'</b><br><small style="color:var(--mut)">'+e[2]+' · '+e[3]+'</small></div>'+bd('New','n')+'</div>').join('')+'<h3 style="margin-top:16px">Applications waiting</h3><div class="sw"><div><b>Registered Nurse</b><br><small style="color:var(--mut)">4 new applicants</small></div>'+bd('Review','r')+'</div></div></div>',
enq:()=>hd('Enquiries','All requests from the website form, WhatsApp and calls.','<button class="btn o">Export CSV</button>')+'<div class="f" style="margin-bottom:12px"><input placeholder="Search name, phone or area"></div>'+tabs('enq',['All','New','Contacted','Assessment booked','Care started','Not proceeding'])+table(["Name","Phone","Service","Area","Status","Received","Assigned"],E.map(e=>[e[0],e[1],e[2],e[3],bd(e[4],sc[e[4]]),e[5],e[6]]),'enqd'),
enqd:()=>hd('Sarah Namukasa','Enquiry · received today 09:12 via website form','<button class="btn o" data-go="enq">← Back</button>')+'<div class="two w"><div><div class="box"><h3>Request</h3><div class="f g2">'+inp('Phone','0772 123 456')+inp('Area','Ntinda')+inp('Care needed','Postnatal and newborn care')+inp('Who needs care','My baby and me')+inp('Preferred start','This week')+inp('Source','Website form')+'</div><div style="margin-top:12px">'+ta('Note from family','First baby, born by caesarean last week.')+'</div><div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><a class="btn" href="tel:+256772123456">Call</a><a class="btn g" href="https://wa.me/256772123456">WhatsApp</a></div></div><div class="box"><h3>Add a note</h3><div class="f">'+ta('Internal note','')+'<button class="btn">Save note</button></div></div></div><div><div class="box"><h3>Status</h3><div class="f">'+sl('Status',Object.keys(sc),'New')+sl('Assigned to',['Unassigned','Grace','Ruth','Esther'],'Unassigned')+sl('If not proceeding, reason',['—','Price','No capacity','Outside area','Other'])+'<button class="btn">Update</button></div></div><div class="box"><h3>Timeline</h3><ul class="tl"><li>Request received<small>Today 09:12 · consent given</small></li><li>Alert sent to coordinators<small>Today 09:12</small></li></ul></div></div></div>',
job:()=>hd('Careers','Create and manage open roles.','<button class="btn" data-go="jobe">+ New job</button>')+table(["Role","Location","Type","Closing","Applicants","Published"],[["Registered Nurse","Kampala","Full-time","30 Nov","4",bd('Live')],["Midwife","Kampala","Part-time","15 Nov","2",bd('Live')],["Caregiver and Companion","Kampala","Contract","10 Oct","1",bd('Closed','x')],["Physiotherapist","Kampala","Part-time","Draft","0",bd('Draft','n')]],'jobe'),
jobe:()=>hd('Edit job','Changes appear on the Careers page when published.','<button class="btn o" data-go="job">← Back</button>')+'<div class="box"><div class="f g2">'+inp('Job title','Registered Nurse')+sl('Department',['Clinical','Care','Admin'],'Clinical')+inp('Location','Kampala')+sl('Type',['Full-time','Part-time','Contract'],'Full-time')+inp('Closing date','2026-11-30','date')+inp('Registration required','Yes')+'</div><div class="f" style="margin-top:12px">'+ta('Description','Provide skilled nursing care to families at home.')+ta('Requirements','Diploma in nursing. Current registration. 2 years experience.')+sw('Published',1,'Visible on the public Careers page')+sw('Show closing date',1)+'<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn">Save and publish</button><button class="btn o">Save draft</button><button class="btn d">Close job</button></div></div></div>',

const GRP={enqd:'enq',jobe:'job'};
function show(p){cur=p;const lg=p==='login';
  $('sb').style.display=lg?'none':'';$('bn').style.display=lg?'none':'';$('top').style.display=lg?'none':'';
  A.style.gridTemplateColumns=lg?'1fr':'';A.style.gridTemplateRows=lg?'1fr':'';
  $('tt').textContent=(PAGES.find(x=>x[0]===p)||[0,''])[1];
  $('pgc').innerHTML=V[p]();$('pgc').style.padding=lg?'0':'';$('pgc').style.maxWidth=lg?'none':'';
  const k=GRP[p]||p;document.querySelectorAll('[data-k]').forEach(b=>b.setAttribute('aria-current',b.dataset.k===k));
  $('sel').value=p;$('mc').scrollTop=0}
A.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){const t=g.dataset.go;show(V[t]?t:'dash');return}
  const t=e.target.closest('[data-tab]');if(t){const w=t.parentNode;[...w.children].forEach(b=>b.setAttribute('aria-pressed',b===t));
    const id=w.dataset.tabs;if(id==='enq'){const f=t.textContent;document.querySelectorAll('#pgc .tb tbody tr').forEach(r=>{r.style.display=(f==='All'||r.children[4].textContent.trim()===f)?'':'none'})}document.querySelectorAll('[data-t^="'+id+'"]').forEach(d=>d.style.display=d.dataset.t===id+t.dataset.tab?'block':'none');return}
  const s=e.target.closest('.sw button');if(s){s.setAttribute('aria-pressed',s.getAttribute('aria-pressed')!=='true');return}
  if(e.target.closest('.ch i'))e.target.closest('.ch span').remove();
});
$('sel').innerHTML=PAGES.map(p=>'<option value="'+p[0]+'">'+p[1]+'</option>').join('');
$('sel').onchange=e=>show(e.target.value);
let W=375;
function fit(){const h=Math.max(440,innerHeight-$('bar').offsetHeight-24),s=Math.min(1,($('stage').clientWidth-24)/(W+14));$('wf').style.width=(W+14)*s+'px';$('wf').style.height=h+'px';$('fr').style.width=(W+14)+'px';$('fr').style.height=h/s+'px';$('fr').style.transform='scale('+s+')'}
$('gv').onclick=e=>{const b=e.target.closest('button');if(!b)return;W=+b.dataset.w;[...$('gv').children].forEach(x=>x.setAttribute('aria-pressed',x===b));fit()};
addEventListener('resize',fit);show('login');fit();
