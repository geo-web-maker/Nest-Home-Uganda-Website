<style>
:root{--ink:#123524;--mut:#4A6354;--line:#CBD8C6;--onf:#F4F1DF;--gold:#C79A3B;--leaf:#1F8A5B;--moss:#2F6B4A;--straw:#E9DDB8;--mint:#DFF0E6;--out:cubic-bezier(.22,1,.36,1);--ease:cubic-bezier(.32,.72,0,1);--serif:"Fraunces",Georgia,serif;--sans:"Figtree",system-ui,sans-serif;--script:"Cormorant Garamond",Georgia,serif}
*{box-sizing:border-box;margin:0}body{background:#D5DCD1;color:var(--ink);font:400 16px/1.5 var(--sans)}

.tb .r1{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}.tb b{font:700 16px var(--serif)}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button,.chips button{padding:7px 14px;border-radius:999px;font-size:14px;font-weight:600;color:var(--mut);white-space:nowrap;transition:background .24s var(--out),color .24s var(--out)}
.seg .on,.chips .on{background:var(--ink);color:var(--onf)}.chips{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding:2px}.chips button{background:#fff;border:1px solid var(--line)}
#st{display:flex;flex-wrap:wrap;gap:34px;justify-content:center;padding:22px 12px 60px}.sg{display:flex;flex-direction:column;align-items:center;gap:10px}
.cp2{font:600 13px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.dev{background:#0E1A13;position:relative;overflow:hidden}.dev.p{padding:10px;border-radius:52px}.dev.t{padding:12px;border-radius:36px}.dev.d{border-radius:14px}
.dev.p .vp{border-radius:42px}.dev.t .vp{border-radius:26px}
.dev.p:before{content:"";position:absolute;z-index:60;top:19px;left:50%;width:100px;height:26px;margin-left:-50px;border-radius:20px;background:#0E1A13}
.bar{height:38px;display:flex;align-items:center;gap:7px;padding:0 14px;background:#E8EDE4}.bar i{width:11px;height:11px;border-radius:50%;background:#B9C4B4}.bar span{margin:0 auto;background:#fff;border-radius:999px;padding:3px 22px;font-size:13px;color:var(--mut)}
/* ===== design system (from the website tokens) ===== */

em{font:italic 600 1.12em var(--script);color:var(--gold)}
.mu{color:var(--mut);font-size:.95rem}.lead{font-size:1.15rem;max-width:36ch;opacity:.92;margin:16px 0 24px}
.rule{font:600 12.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#8F6C1C;display:flex;align-items:center;gap:10px;margin-bottom:14px}.rule:before{content:"";width:22px;height:1px;background:var(--gold)}
.band{background:var(--ink);color:var(--onf)}.band .rule{color:var(--gold)}.band .mu{color:#B9CBBE}
.w{max-width:1180px;margin:0 auto;padding:0 20px}.sec{padding:48px 0}.sub2{margin-bottom:26px;max-width:22ch}
.btn{display:inline-flex;align-items:center;gap:12px;min-height:52px;padding:6px 6px 6px 24px;border-radius:999px;background:var(--gold);color:#1B1706;font-weight:600;transition:transform .2s var(--out);white-space:nowrap}
.btn i{width:40px;height:40px;border-radius:50%;background:rgba(27,23,6,.12);display:grid;place-items:center;transition:transform .5s var(--ease)}.btn:active{transform:scale(.98)}
.btn.wa{background:#25D366;color:#06260F}.btn.fo{background:var(--ink);color:var(--onf)}.btn.fo i{background:rgba(244,241,223,.14)}
.btn.gh{background:rgba(18,53,36,.07);color:var(--ink)}.band .btn.gh{background:rgba(244,241,223,.12);color:var(--onf)}
.btn.sm{min-height:42px;padding-left:18px;font-size:14px}.btn.sm i{width:30px;height:30px}.btn.full{width:100%;justify-content:space-between;min-height:56px}
@media(hover:hover){.btn:hover i{transform:translate(3px,-1px) scale(1.06)}.card.lk:hover{transform:translateY(-3px)}}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.card{background:rgba(18,53,36,.05);padding:6px;border-radius:28px;box-shadow:0 0 0 1px rgba(18,53,36,.07);transition:transform .4s var(--ease)}
.in{background:#fff;border-radius:22px;padding:18px;box-shadow:inset 0 1px 1px #fff,0 12px 28px -18px rgba(18,53,36,.3)}.card.hot .in{background:var(--ink);color:var(--onf)}.card.hot .mu{color:#B9CBBE}
.chip{display:inline-flex;gap:5px;align-items:center;font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;white-space:nowrap}
.k-ok{background:#E3F2E8;color:#17663F}.k-rv{background:#F7EBCB;color:#7A4F00}.k-pd{background:#E8ECE6;color:#4A6354}.k-pg{background:var(--mint);color:var(--ink)}.k-new{background:#F3E6C4;color:#5C4310}.k-bad{background:#F6DAD6;color:#8E1D16}.k-sc{box-shadow:inset 0 0 0 1px var(--line);color:var(--mut)}
.card.hot .chip{background:rgba(244,241,223,.14);color:var(--onf)}
.g{display:grid;gap:12px}.c2,.c3,.c4{grid-template-columns:1fr}.st{grid-template-columns:1fr 1fr}
.sg2{display:flex;gap:12px;align-items:center}.r{display:flex;justify-content:space-between;align-items:center;gap:10px}
.egg{width:60px;height:70px;flex:none;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:var(--straw);display:grid;place-items:center;font:700 18px var(--serif);color:#2A2410}
.eggs{display:flex;gap:10px;justify-content:center}.eg{flex:1;max-width:180px;aspect-ratio:3/4;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:10px;font:700 1.3rem var(--serif)}.eg small{font:600 .85rem var(--sans)}
.eg:nth-child(1){background:var(--straw);color:#2A2410}.eg:nth-child(2){background:var(--leaf);color:#fff}.eg:nth-child(3){background:var(--moss);color:var(--onf)}
.arch{width:52px;height:60px;border-radius:999px 999px 14px 14px;background:var(--leaf);color:#fff;display:grid;place-items:center;font:700 1.2rem var(--serif);margin-bottom:12px}
.rings{display:flex;flex-wrap:wrap;gap:20px;justify-content:center}.ring{width:150px;height:150px;border-radius:50%;border:1.5px solid var(--gold);box-shadow:0 0 0 6px rgba(199,154,59,.35);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:14px;font:700 1.35rem var(--serif)}.ring small{font:400 .85rem var(--sans);opacity:.85}
.strip{background:var(--gold);color:#1B1706;padding:14px 0;font-weight:600}.strip b{font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-right:10px}
.steps{display:grid;gap:22px}.steps b{font:700 2.4rem var(--serif);color:var(--gold)}
.cts{border:1px dashed var(--gold);border-radius:14px;padding:14px;color:var(--mut);font-style:italic;background:rgba(199,154,59,.07)}
.map{height:200px;border-radius:18px;background:repeating-linear-gradient(45deg,var(--straw),var(--straw) 8px,#F1E8C9 8px,#F1E8C9 16px);display:grid;place-items:center;text-align:center;padding:12px;color:#2A2410;font-weight:600;font-size:14px}
.ph{height:150px;border-radius:16px;background:repeating-linear-gradient(45deg,var(--straw),var(--straw) 8px,#F1E8C9 8px,#F1E8C9 16px);display:grid;place-items:center;color:#2A2410;font-size:13px;font-weight:600;margin-bottom:12px}
.tags{display:flex;flex-wrap:wrap;gap:8px}.tags span{padding:9px 16px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);font-weight:500}
details{border-bottom:1px solid var(--line);padding:16px 0}summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px}summary:after{content:"+";color:var(--gold);font-size:1.4rem;line-height:1}details[open] summary:after{content:"–"}
.fl{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.fl label{font-weight:600;font-size:14px}.fl input,.fl select{min-height:48px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 14px;font:inherit;color:var(--ink)}
/* website shell */
.hdr{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--onf);border-bottom:1px solid rgba(199,154,59,.4)}.hdr .w{display:flex;align-items:center;justify-content:space-between;min-height:68px;gap:14px}
.logo{display:flex;align-items:center;gap:10px;font:700 1.1rem/1.05 var(--serif)}.logo small{display:block;font:500 .72rem var(--sans);color:var(--gold)}
.nav{display:none;gap:22px;font-size:.95rem;font-weight:500}.nav span{opacity:.88}.nav .on{opacity:1;color:var(--gold)}.hb{display:grid;place-items:center;width:44px;height:44px}
.hero{padding:44px 0 56px}.hg{display:grid;gap:34px;align-items:center}
.cb{position:sticky;bottom:0;z-index:20;display:flex;gap:8px;padding:10px 14px;background:var(--ink);border-top:1px solid rgba(199,154,59,.4)}.cb .btn{flex:1;justify-content:space-between}
.foot{padding:48px 0 30px}.foot .g{gap:28px}.foot h3{color:var(--gold);font:600 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px}.foot p{opacity:.88;margin-bottom:6px;font-size:.93rem}
/* admin + app shells */
.adm,.app{display:flex;align-items:flex-start;min-height:100%}
.sd,.rail{display:none;position:sticky;top:0;height:var(--h);flex:none;flex-direction:column;gap:4px;overflow:auto;width:78px;padding:16px 10px}.sd{background:var(--ink);color:var(--onf)}.rail{align-items:center;justify-content:center;gap:10px;padding:16px 0;width:96px}
.sd a,.rail a{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border-radius:14px;font-size:15px;font-weight:500;opacity:.85;transition:background .3s var(--out)}.sd a span{display:none}.sd .on{background:rgba(199,154,59,.18);opacity:1;box-shadow:inset 3px 0 0 var(--gold)}
.sd small{display:none;font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:14px 14px 4px}.sd .logo{padding:6px 8px 14px}.sd .logo>span,.sd .logo small{display:none}
.rail a{flex-direction:column;gap:2px;width:72px;height:70px;justify-content:center;font-size:12px;font-weight:600;border-radius:36px;padding:0;color:var(--mut);opacity:1}.rail .on{background:var(--ink);color:var(--onf)}
.main{flex:1;min-width:0;padding:18px 18px 90px}.atop{position:sticky;top:0;z-index:10;background:var(--ink);color:var(--onf);display:flex;justify-content:space-between;align-items:center;padding:0 16px;min-height:60px}
.bnav,.ptabs{position:sticky;bottom:0;z-index:10;display:flex}.bnav{background:var(--ink);color:var(--onf);padding:6px 6px 10px}.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;min-height:50px;justify-content:center;opacity:.75}.bnav .on{opacity:1;color:var(--gold)}
.ptabs{bottom:14px;margin:0 14px;background:rgba(255,255,255,.78);backdrop-filter:blur(16px);border-radius:999px;padding:5px;box-shadow:0 0 0 1px rgba(18,53,36,.08),0 16px 32px -14px rgba(18,53,36,.35)}.ptabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:54px;border-radius:999px;font-size:12px;font-weight:600;color:var(--mut)}.ptabs .on{background:var(--ink);color:var(--onf)}
.ph1{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:flex-end;margin-bottom:20px}.adm h1,.app h1{font-size:clamp(1.7rem,3.4cqw,2.4rem)}
.ft{display:flex;gap:6px;overflow-x:auto;margin:0 0 16px}.ft span{padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap;background:rgba(18,53,36,.06)}.ft .on{background:var(--ink);color:var(--onf)}
.num{font:700 2.2rem/1 var(--serif);margin-bottom:6px}.bars{display:flex;align-items:flex-end;gap:10px;height:140px;margin-top:12px}.bars i{flex:1;background:var(--leaf);border-radius:8px 8px 3px 3px;height:var(--v);transform-origin:bottom;animation:grow .8s var(--ease) both;animation-delay:calc(var(--i)*60ms)}.bars i:nth-child(5){background:var(--gold)}
.lab{display:flex;gap:10px;font-size:12px;color:var(--mut)}.lab span{flex:1;text-align:center}
.tbl .th{display:none}.tr{display:flex;flex-direction:column;gap:3px;padding:14px 14px;border-bottom:1px solid #E9EDE4}.tr:last-child{border:0}.td{font-size:14px}.td+.td:before{content:attr(data-l) ": ";color:var(--mut)}.td:first-child{font-weight:700;font-size:16px}
.lg{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:var(--bg)}.lg .card{width:100%;max-width:420px}
.ng{display:grid;gap:22px}.side{display:none}.pane{display:none}.det .lst{display:none}.det .pane{display:block}
.one{max-width:560px;margin:0 auto}.big-t{font:600 56px/1 var(--serif);font-variant-numeric:tabular-nums;text-align:center;margin:14px 0 6px}.tmr{font:700 26px var(--serif);font-variant-numeric:tabular-nums;margin-top:8px}
.hr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #E9EDE4}.hr:last-child{border:0}.hr div{display:flex;flex-direction:column}
.lb{font:600 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:18px 0 8px}.in>.lb:first-child{margin-top:0}
.pt{display:flex;gap:10px}.pt i,.pt b{width:72px;height:72px;border-radius:14px;display:grid;place-items:center;background:repeating-linear-gradient(45deg,var(--straw),var(--straw) 6px,#F1E8C9 6px,#F1E8C9 12px);color:#2A2410;font-style:normal}.pt b{background:none;border:1px dashed var(--mut);color:var(--mut);font-size:13px}
.bn2{display:flex;gap:8px;align-items:center;min-height:44px;padding:0 14px;border-radius:12px;background:#E2E8DF;color:var(--mut);font-size:14px;font-weight:600;margin-bottom:14px}
@container v (min-width:700px){.w{padding:0 36px}.sec{padding:64px 0}.c2,.c3,.c4{grid-template-columns:1fr 1fr}.st{grid-template-columns:repeat(4,1fr)}.steps{grid-template-columns:repeat(3,1fr)}.cb{display:none}.hero{padding:70px 0 84px}.foot .g{grid-template-columns:1.4fr 1fr 1fr}
.sd,.rail{display:flex}.bnav,.ptabs,.atop{display:none}.main{padding:28px 30px 48px}.ng{grid-template-columns:320px 1fr}.pane{display:block}.det .lst{display:block}}

.sd{width:248px}.sd a span,.sd small{display:inline}.sd .logo>span,.sd .logo small{display:block}.main{padding:36px 44px 60px}.ng{grid-template-columns:340px 1fr 300px}.side{display:block}
.dg{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}.tr,.tbl .th{display:grid;grid-template-columns:var(--cols);gap:14px;align-items:center;padding:14px 18px}.tbl .th{font:600 12px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--line)}.td+.td:before{display:none}.td:first-child{font-size:15px}}
@keyframes up{from{opacity:0;transform:translateY(16px);filter:blur(6px)}}@keyframes grow{from{transform:scaleY(0)}}
.an .up{animation:up .56s var(--out) both;animation-delay:calc(var(--i,0)*70ms)}

document.addEventListener('pointerdown',e=>{const b=e.target.closest('.sosbtn');if(!b)return;const d=b.closest('.sosdemo');e.preventDefault();clearTimeout(d._h);d.dataset.s='hold';d._h=setTimeout(()=>{d.dataset.s='count';let n=5;const c=d.querySelector('.cdn');c.textContent=n;clearInterval(d._c);d._c=setInterval(()=>{n--;if(n<=0){clearInterval(d._c);d.dataset.s='sent'}else c.textContent=n},1000)},2000)});
const holdEnd=e=>{document.querySelectorAll('.sosdemo[data-s=hold]').forEach(d=>{clearTimeout(d._h);d.dataset.s='idle'})};
document.addEventListener('pointerup',holdEnd);document.addEventListener('pointercancel',holdEnd);
document.addEventListener('click',e=>{const a=e.target.closest('[data-sos]');if(!a)return;const d=a.closest('.sosdemo');clearInterval(d._c);clearTimeout(d._h);d.dataset.s=a.dataset.sos});

/* ================= registries ================= */
const AP={},AD={},WP={};
/* AP/AD/WP entries: id:[label,url,fn,meta,bare] ; meta = 'Phase · section|what it shows' */
const merge=(reg,add)=>Object.entries(add).forEach(([id,[l,u,f,m,b]])=>{reg[id]=[l,u,f,null,m,b]});
const reorder=(reg,spec)=>{const o={};spec.forEach(([g,ids])=>ids.forEach(i=>{if(!reg[i])throw new Error('missing page '+i);reg[i][3]=g;o[i]=reg[i]}));Object.keys(reg).forEach(k=>{if(!o[k])throw new Error('unplaced page '+k)});return o};

/* ================= NURSE APP: new pages ================= */
const bs=id=>SF.app[2](id,SF.app[1][id][2]());
const lgw=(b)=>`<div class="lg" style="align-items:start;padding-top:28px"><div class="one up" style="width:100%">${b}</div></div>`;
const opt3=a=>`<div class="g" style="gap:8px;margin-top:12px">${a.map(x=>`<span class="chip k-sc" style="justify-content:center;padding:11px;background:#fff">${x}</span>`).join('')}</div>`;

/* ---- start and permissions ---- */
AP.consent=[`Privacy and consent`,ra('welcome/privacy'),()=>lgw(`${mark}${gp(8)}<h2>Before you start</h2><p class="mu" style="margin:6px 0 16px">Please read how Nest Home Care uses your location. This is shown on first login, and again if the notice changes.</p>${cd('What is captured',[['pin','Your location at the moment you tap Arrive or Leave, add a note or photo, or send SOS.'],['clock','The time of each action on your phone.'],['eye','Seen by your supervisor and the office team. Clients do not see it.']].map(([i,t])=>`<div class="sg2" style="align-items:flex-start;margin:10px 0">${ic(i,20)}<span>${t}</span></div>`).join('')+`<p class="mu" style="margin-top:10px">We do <b>not</b> follow you between actions. How long it is kept: client to supply.</p>`)}${gp()}${cts(`Full privacy notice, version 1. Text to be supplied by the client and reviewed by a lawyer.`)}${cb(`I have read the privacy notice (v1)`,1)}${cb(`I agree to my location being captured as described`,1)}${gp(6)}${bt('Accept and continue','full')}<p class="mu" style="text-align:center;margin-top:14px">Read the full notice</p>`),`Phase 4 · §16.1, §11.10|First login. Acceptance is saved in the consents collection with the notice version and time, and shown again when the version changes.`,1];

AP.locexp=[`Location explained`,ra('welcome/location'),()=>lgw(`<div class="big-ic" style="background:var(--mint);color:var(--leaf)">${ic('pin',40)}</div><h2 style="text-align:center;margin-bottom:8px">Why we ask for location</h2><p class="mu" style="text-align:center;margin-bottom:18px">So your supervisor can confirm you reached the client. Nothing more.</p>${cd('',[['today','When','Only when you tap Arrive or Leave, add a note or photo, or send SOS.'],['user','Who sees it','Your supervisor and office admins.'],['gear','Android app only','An optional prompt when you seem to have arrived. You choose.']].map(([i,a,b])=>`<div class="hr" style="align-items:flex-start;gap:14px">${ic(i,20)}<div style="flex:1"><b>${a}</b><span class="mu">${b}</span></div></div>`).join(''))}${gp(14)}${bt('Continue','full')}${gp(18)}<div class="card"><div class="in" style="text-align:center;background:#EDEDED"><p class="lb" style="text-align:center">Next, your phone’s own prompt</p><b>Allow Nest Home Care to access this device’s location?</b>${opt3(['While using the app','Only this time',`Don’t allow`])}</div></div>`),`Phase 4 · §11.10|Our own explanation comes first, then the phone’s system prompt. Wording avoids anything accusatory.`,1];

AP.ios=[`iPhone: add to Home Screen`,ra('welcome/install'),()=>lgw(`<div class="big-ic" style="background:var(--straw);color:#2A2410">${ic('phone',38)}</div><h2 style="text-align:center;margin-bottom:6px">Install Nest on your iPhone</h2><p class="mu" style="text-align:center;margin-bottom:12px">Three taps. It then opens like a normal app, even offline.</p>${cd('',`<div class="step"><b>1</b><div><b>Tap the Share button</b><span class="mu">At the bottom of Safari</span><div class="pill2" style="margin-top:8px;width:max-content">${ic('share',18)} Share</div></div></div><div class="step"><b>2</b><div><b>Choose “Add to Home Screen”</b><span class="mu">Scroll the list if you cannot see it</span><div class="pill2" style="margin-top:8px;width:max-content">${ic('plus',18)} Add to Home Screen</div></div></div><div class="step"><b>3</b><div><b>Tap “Add”</b><span class="mu">The Nest egg appears on your Home Screen</span><div style="margin-top:8px"><i class="egg" style="width:46px;height:54px;font-size:14px">N</i></div></div></div>`)}${gp()}${bt('Got it','full')}<p class="mu" style="text-align:center;margin-top:14px">Shown once, only on iPhone in a browser tab</p>`),`Phase 4 · §11.10 step 2|One-time hint for iPhone nurses. The iPhone version is a PWA, so location works only while the app is open.`,1];

AP.andperm=[`Android permissions`,ra('welcome/android'),()=>`<div class="main" style="max-width:1100px;margin:0 auto">${hh('Android app only · three steps','Allow arrival prompts')}${grid([cd('Step 1 · Disclosure',`<h3 style="margin-bottom:8px">Use location in the background?</h3><p class="mu" style="margin-bottom:14px">Nest Home Care collects location data to prompt you when you arrive at a client’s home, even when the app is closed or not in use. It is not used for advertising.</p>${bt('Allow','full')}${gp(8)}${bt('No thanks','full gh')}`),cd('Step 2 · Phone settings',`<h3 style="margin-bottom:6px">Location for Nest Home Care</h3>${rad(['Allow all the time','Allow only while using the app','Ask every time',`Don’t allow`],0)}<p class="mu" style="margin-top:8px">Choose <b>Allow all the time</b>. Without it you can still use Arrive and Leave by hand.</p>`),cd('Step 3 · Battery',`<h3 style="margin-bottom:6px">Battery usage</h3>${rad(['Unrestricted','Optimized','Restricted'],0)}<p class="mu" style="margin-top:8px">Some phones close apps to save power. Unrestricted keeps arrival prompts working with the screen off.</p>${gp(8)}${bt('Open battery settings','sm gh')}`)],'c3')}${gp(14)}<div class="annot">Not part of the iPhone PWA. Only shown once the Capacitor Android build exists (Phase 7). Skipping any step is allowed and never blocks check-in.</div></div>`,`Phase 7 · §9.4, §11.10 step 3|Prominent disclosure, then “Allow all the time”, then battery optimisation. All three are shown before any background capture starts.`,1];

AP.update=[`Update prompts`,ra('update'),()=>`<div class="main" style="max-width:1100px;margin:0 auto">${hh('Android · from /app/version','Update prompts')}${grid([cd('Soft prompt · a newer version exists',`${ban('info','download','Version 1.0.2 is ready. <b>Update</b>')}${gp(6)}<p class="mu">A slim banner on Today. Can be dismissed. Appears when the app version is below the latest.</p>`),cd(`Blocking · below the minimum`,`<div class="big-ic" style="background:#F7EBCB;color:#7A4F00">${ic('download',36)}</div><h3 style="text-align:center">Please update to continue</h3><p class="mu" style="text-align:center;margin:6px 0 14px">This version (1.0.0) is no longer supported. Your saved visits are safe and will be sent after the update.</p>${bt('Download update','full')}${gp(8)}${bt('Call the office','full gh')}`),cd('Old browser or WebView',`<div class="big-ic" style="background:#E8ECE6;color:var(--mut)">${ic('alert',36)}</div><h3 style="text-align:center">Update your browser</h3><p class="mu" style="text-align:center;margin-top:6px">This phone’s browser is too old for Nest. Update Chrome or Android System WebView, then open Nest again.</p>`)],'c3')}</div>`,`Phase 7 · §11.11, §26|Soft banner, blocking screen when below min_supported_version, and the plain message for unsupported browsers on very old phones.`,1];

AP.arrive=[`Arrive sheet`,ra('visits/v2'),()=>sheet(bs('visit'),`<h2>Check in at John Ddungu?</h2><div class="sg2" style="margin:12px 0 4px">${ic('pin',22)}<div style="flex:1"><b>Location found</b><p class="mu">Accuracy: good</p></div>${k('Ready','ok')}</div><p class="mu" style="font-size:13px;margin-bottom:12px">Still searching? You can confirm anyway. Location will be saved if available.</p><div class="hr"><div><b>Safety timer</b><span class="mu">Tell my supervisor if I have not left by 10:15</span></div>${tg(1)}</div>${gp(16)}${bt('Confirm arrival','full')}${gp(8)}${bt('Cancel','full gh')}`),`Phase 4 · §11.4, §23.4|Confirm is never blocked by a slow GPS fix. The optional safety timer is started here.`,1];

AP.leave=[`Leave sheet`,ra('visits/v1'),()=>sheet(bs('active'),`<h2>Leave Mary Kisakye?</h2><div class="big-t" style="font-size:44px;margin:6px 0">00:58:12</div><p class="mu" style="text-align:center;margin-bottom:12px">Total time on site</p>${ta('Final note (optional)','Medication reminder given. Daughter will return at 11.',70)}<div class="hr"><span>Photos</span><b>2 of 5 uploaded</b></div><div class="hr"><span>Safety timer</span><b>Stops when you leave</b></div>${gp(14)}${bt('Confirm departure','full')}${gp(8)}${bt('Cancel','full gh')}`),`Phase 4 · §11.6|Total time, an optional final note, then Confirm. After this the visit becomes Completed and a “Visit saved” toast appears.`,1];

AP.adhoc=[`Unscheduled visit`,ra('today'),()=>sheet(bs('today'),`<h2>Who did you visit?</h2><p class="mu" style="margin-bottom:6px">Choose from your own clients. No typing.</p>${rad(['Mary Kisakye · Ntinda','John Ddungu · Bugolobi','Esther Namugga · Kisaasi'],0)}${gp(6)}${ban('info','info','Your supervisor will review unscheduled visits.')}${gp(14)}${bt('Start visit','full')}${gp(8)}${bt('Cancel','full gh')}`),`Phase 5B · §11.13, §7.3|Appears only when a super admin has switched unscheduled visits on. Starts a visit with an immediate check-in and flags it for review.`,1];

AP.sostry=[`SOS · try it`,ra('visits/v1'),()=>`<div class="one">${hh('Interactive','SOS hold and cancel')}<div class="sosdemo" data-s="idle"><div class="p-idle">${cd('',`<p class="hold-hint">Press and <b>hold</b> the red button for 2 seconds.</p><div class="sosbtn" role="button" aria-label="Hold to send SOS">SOS<svg viewBox="0 0 160 160"><circle cx="80" cy="80" r="70"/></svg></div><p class="hold-hint">Let go early and nothing happens.</p>`)}</div><div class="p-count">${cd('',`<p class="cdn" style="font-size:20px;color:var(--ink);font-family:var(--sans)">Sending alert in</p><div class="cdn">5</div><span data-sos="idle" style="display:block">${bt('Cancel — I’m safe','full')}</span><p class="mu" style="text-align:center;margin-top:12px">Cancel now and nothing is sent.</p>`)}</div><div class="p-sent">${cd('',`<div class="big-ic" style="background:#E3F2E8;color:#17663F">${ic('check',40)}</div><h2 style="text-align:center">Alert sent to your supervisor</h2><p class="mu" style="text-align:center;margin:6px 0 16px">Help is being notified.</p>${bt('Call emergency number','full dg')}${gp(8)}${bt('Call supervisor','full gh')}${gp(8)}<span data-sos="safe" style="display:block">${bt('I’m safe now','full fo')}</span><p class="mu" style="text-align:center;margin-top:12px;font-size:13px">SOS notifies your supervisor. In immediate danger, also call the emergency number.</p>`)}</div><div class="p-safe">${cd('',`<div class="big-ic" style="background:var(--mint);color:var(--leaf)">${ic('heart',40)}</div><h2 style="text-align:center">Glad you’re safe</h2><p class="mu" style="text-align:center;margin:6px 0 16px">Your supervisor has been told. The alert is closed.</p><span data-sos="idle" style="display:block">${bt('Start the demo again','full gh')}</span>`)}</div></div>${gp(14)}<div class="annot">Hold time (2 s), cancel window (5 s) and the emergency numbers come from settings: <code>sos.hold_seconds</code>, <code>sos.cancel_window_s</code>, <code>sos.emergency_numbers</code>. Nothing is AP.sossent=[`SOS · sent online`,ra('sos/active'),()=>`<div class="one">${cd('',`<div class="big-ic" style="background:#E3F2E8;color:#17663F">${ic('check',40)}</div><h2 style="text-align:center">Alert sent to your supervisor</h2><p class="mu" style="text-align:center;margin:6px 0 14px">10:12 · Help is being notified.</p>${tl([['','Alert received','10:12:04 · Supervisor and on-call responder notified'],['','Acknowledged','10:12:51 · Ruth B. is calling you'],['n','Waiting for you','Tap “I’m safe now” when it is over']])}${gp(14)}${bt('Call emergency number','full dg')}${gp(8)}${bt('Call Ruth B. (supervisor)','full gh')}${gp(8)}${bt('I’m safe now','full fo')}<p class="mu" style="text-align:center;margin-top:12px;font-size:13px">SOS notifies your supervisor. In immediate danger, also call the emergency number.</p>`)}</div>`,`Phase 12 · §23.1, §23.3|The only things on screen after sending: status, the two Call buttons and “I’m safe now”.`,1];
