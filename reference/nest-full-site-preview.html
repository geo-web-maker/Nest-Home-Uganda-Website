<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Well Nest Home Care Uganda: Full Site Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Figtree:wght@400;500;600&family=Cormorant+Garamond:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--pbg:#E4EBE0;--gold:#C79A3B;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pbg:#08120D}}
:root[data-theme="dark"]{--pbg:#08120D}
html,body{margin:0;height:100%}
body{background:var(--pbg);font:500 15px/1.4 "Figtree",system-ui,sans-serif;display:flex;flex-direction:column}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{background:#123524;color:#F4F1DF;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:center}
.bar h1{font:700 1rem "Fraunces",Georgia,serif;margin:0;flex:1 1 100%;text-align:center}
.grp{display:flex;gap:4px;background:rgba(255,255,255,.1);padding:3px;border-radius:999px}
.grp button{border:0;background:transparent;color:inherit;min-height:38px;padding:0 14px;border-radius:999px;font:600 .88rem "Figtree",sans-serif;cursor:pointer}
.grp button[aria-pressed="true"]{background:var(--gold);color:#1B1706}
.bar select{min-height:42px;border-radius:999px;border:0;padding:0 14px;font:600 .9rem "Figtree",sans-serif;background:#F4F1DF;color:#123524}
.stage{flex:1;min-height:0;padding:12px;overflow:hidden}
.wrapf{margin:0 auto}
.frame{transform-origin:top left;border:7px solid #0E1A13;border-radius:26px;overflow:hidden;background:#fff;box-shadow:0 14px 40px rgba(0,0,0,.28)}
.site{--bg:#F3F8F1;--mint:#DFF0E6;--surf:#fff;--ink:#123524;--mut:#4A6354;--forest:#123524;--leaf:#1F8A5B;--moss:#2F6B4A;--gold:#C79A3B;--straw:#E9DDB8;--line:#CBD8C6;--onf:#F4F1DF;--serif:"Fraunces",Georgia,serif;--sans:"Figtree",system-ui,sans-serif;--script:"Cormorant Garamond",Georgia,serif;--egg:50% 50% 50% 50%/62% 62% 38% 38%;--arch:999px 999px 18px 18px;
 container-type:inline-size;height:100%;overflow:auto;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--sans);scroll-behavior:smooth}
.site h1,.site h2,.site h3{font-family:var(--serif);margin:0;line-height:1.1;letter-spacing:-.01em}.site p{margin:0}.site a{color:inherit}
.w{padding:0 20px;max-width:1180px;margin:0 auto}
em.s{font-family:var(--script);font-style:italic;font-weight:600;color:var(--gold);letter-spacing:0}
.rule{display:flex;align-items:center;gap:10px;color:var(--gold);margin-bottom:12px;font:600 .74rem var(--sans);letter-spacing:.14em;text-transform:uppercase}
.rule::before{content:"";width:30px;height:1px;background:var(--gold)}.rule::after{content:"";width:6px;height:6px;border:1.5px solid var(--gold);transform:rotate(45deg)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border-radius:999px;border:2px solid var(--gold);background:var(--gold);color:#1B1706;font:600 .98rem var(--sans);text-decoration:none;cursor:pointer}
.btn.o{background:transparent;color:inherit;border-color:currentColor}.btn.wa{background:#25D366;border-color:#25D366;color:#06260F}
.hd{background:var(--forest);color:var(--onf);position:sticky;top:0;z-index:9;border-bottom:1px solid rgba(199,154,59,.4)}
.hd .w{display:flex;align-items:center;justify-content:space-between;height:62px;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font:700 1rem/1.05 var(--serif);cursor:pointer;background:none;border:0;color:inherit;padding:0;text-align:left}
.brand small{display:block;font:500 .68rem var(--sans);color:var(--gold)}
.nav{display:none;gap:22px;font-weight:500;font-size:.92rem}.nav button,.mn button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:0;opacity:.88}.nav button:hover{color:var(--gold);opacity:1}
.hd .btn{min-height:40px;padding:0 14px;font-size:.88rem}
.mt{background:none;border:2px solid var(--gold);color:var(--gold);border-radius:12px;min-height:40px;width:44px;font-size:1.2rem;cursor:pointer}
.mn{display:none;background:var(--forest);border-top:1px solid rgba(199,154,59,.3);padding:6px 20px 14px}.mn.open{display:block}.mn button{display:block;width:100%;text-align:left;min-height:46px;font-size:1rem}
.ph{background:var(--forest);color:var(--onf);padding:34px 0 40px}
.ph h1{font-size:clamp(2rem,8cqi,3.6rem);max-width:18ch}.ph p.l{margin-top:14px;max-width:46ch;opacity:.9;font-size:1.08rem}
.cr{font-size:.82rem;opacity:.75;margin-bottom:12px}.cr button{background:none;border:0;color:inherit;font:inherit;padding:0;cursor:pointer;text-decoration:underline}
.hero{background:var(--forest);color:var(--onf);padding:40px 0 0;overflow:hidden}.hero .w{display:grid;gap:28px}
.hero h1{font-size:clamp(2.4rem,10cqi,4.5rem)}.hero .l{margin-top:16px;max-width:34ch;font-size:1.1rem;opacity:.92}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.hero .btn.o,.ph .btn.o{color:var(--onf)}
.art{position:relative;height:300px;max-width:420px;width:100%;margin:0 auto}
.sh{position:absolute;display:flex;align-items:flex-end;justify-content:center;text-align:center;padding:0 8px 18px;font:600 .82rem/1.2 var(--sans)}.sh b{display:block;font:700 1.25rem var(--serif)}
.sh:nth-child(1){width:34%;aspect-ratio:.76;left:0;top:30%;background:var(--straw);color:#2A2410;border-radius:var(--egg);transform:rotate(-7deg)}
.sh:nth-child(2){width:40%;aspect-ratio:.76;left:30%;top:0;background:var(--gold);color:#1B1706;border-radius:var(--egg);z-index:2}
.sh:nth-child(3){width:34%;aspect-ratio:.76;right:0;top:36%;background:var(--moss);color:#fff;border-radius:var(--egg);transform:rotate(8deg)}
.wv{display:block;width:100%;height:46px;margin-top:8px}
.strip{background:var(--gold);color:#1B1706;text-align:center;padding:11px 16px;font-weight:600;font-size:.92rem}
.sec{padding:52px 0}.mint{background:var(--mint)}.dk{background:var(--forest);color:var(--onf)}
.sec h2{font-size:clamp(1.7rem,6cqi,2.8rem);max-width:20ch;margin-bottom:10px}.sub{color:var(--mut);max-width:54ch}.dk .sub{color:var(--onf);opacity:.85}
.grid{display:grid;gap:12px;margin-top:28px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:24px;padding:20px;display:flex;gap:14px;align-items:flex-start;text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
.card:hover{border-color:var(--gold)}.card h3{font:700 1.08rem/1.2 var(--sans);margin-bottom:3px}.card p{color:var(--mut);font-size:.92rem}
.ic{flex:none;width:42px;height:52px;border-radius:var(--arch);background:var(--leaf);color:#fff;display:grid;place-items:center;font:700 1rem var(--serif);padding-top:6px}
.thumb{flex:none;width:68px;height:84px;border-radius:var(--arch);background:var(--leaf) center/cover no-repeat;display:grid;place-items:center;border:2px solid var(--gold);overflow:hidden}
.thumb svg{width:34px;height:34px}
.pic{width:min(260px,72%);aspect-ratio:3/4;box-shadow:0 0 0 10px rgba(199,154,59,.16);border-radius:var(--arch);border:2px solid var(--gold);background:var(--moss) center/cover no-repeat;margin:0 auto}
.ph.ip .w{display:grid;gap:26px}
.ph.ip .pic{margin:0 auto}
.pg .sv{display:flex;gap:14px;align-items:center}
.rings{display:grid;gap:20px;margin-top:30px;justify-items:center}
.ring{width:180px;height:180px;border:2px solid var(--gold);border-radius:50%;display:grid;place-content:center;text-align:center;padding:16px;outline:1px solid rgba(199,154,59,.35);outline-offset:7px}
.ring b{font:700 1.4rem var(--serif)}.ring span{font-size:.88rem;opacity:.85}
.steps{display:grid;gap:22px;margin-top:28px}.st{display:grid;grid-template-columns:52px 1fr;gap:14px}
.n{width:52px;height:62px;display:grid;place-items:center;border-radius:var(--egg);background:var(--gold);color:#1B1706;font:700 1.3rem var(--serif)}
.st h3{font-size:1.2rem;margin-bottom:3px}.st p{color:var(--mut)}
.team{display:grid;gap:14px;grid-template-columns:1fr 1fr;margin-top:28px}.who{text-align:center}
.pho{aspect-ratio:3/4;border-radius:var(--arch);border:2px solid var(--gold);background:repeating-linear-gradient(135deg,var(--straw) 0 8px,transparent 8px 16px),var(--surf);display:grid;place-items:center;font-size:.78rem;color:var(--mut);margin-bottom:10px}
.who h3{font:700 1rem var(--sans)}.who p{color:var(--mut);font-size:.88rem}
.cols{display:grid;gap:30px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.chips span{padding:9px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surf);font-weight:500}
.map{margin-top:22px;aspect-ratio:16/10;border-radius:24px;border:2px dashed var(--gold);display:grid;place-items:center;color:var(--mut);background:var(--surf);text-align:center;padding:12px}
details{background:var(--surf);border:1px solid var(--line);border-radius:18px;margin-top:10px;padding:0 18px}
summary{cursor:pointer;min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}summary::after{content:"+";color:var(--gold);font-size:1.5rem}details[open] summary::after{content:"−"}details p{color:var(--mut);padding-bottom:16px}
.list{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:10px}
.list li{display:flex;gap:12px;background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.list li::before{content:"";flex:none;width:9px;height:9px;margin-top:8px;border:2px solid var(--gold);transform:rotate(45deg)}
.price{background:var(--surf);border:1px solid var(--line);border-radius:26px;padding:24px}.price.f{border-color:var(--gold);border-width:2px}
.price h3{font-size:1.3rem;margin:6px 0}.price .tag{font:700 .72rem var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--leaf)}.price p{color:var(--mut)}
.job{background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;gap:10px;margin-top:12px}
.job h3{font:700 1.1rem var(--sans)}.job span{color:var(--mut);font-size:.9rem}
.form{background:var(--surf);color:var(--ink);border:1px solid var(--gold);border-radius:28px;padding:24px 20px}
.form h3{font-size:1.4rem;margin-bottom:12px}.form label{display:block;font-weight:600;margin-bottom:5px;font-size:.92rem}
.form input,.form select,.form textarea{width:100%;min-height:48px;border:2px solid var(--line);border-radius:14px;padding:0 12px;font:400 1rem var(--sans);background:var(--bg);color:var(--ink);margin-bottom:12px}
.form textarea{min-height:80px;padding:10px 12px}.form .btn{width:100%}.form .or{text-align:center;color:var(--mut);margin:10px 0;font-size:.88rem}
.info{display:grid;gap:10px;margin-top:18px}.info div{background:rgba(255,255,255,.08);border:1px solid rgba(199,154,59,.4);border-radius:18px;padding:14px 16px}.info b{display:block;color:var(--gold)}
.txt h3{font:700 1.2rem var(--sans);margin:22px 0 6px}.txt p{color:var(--mut);max-width:62ch}
.ft{background:var(--forest);color:var(--onf);padding:34px 0 24px;border-top:1px solid rgba(199,154,59,.4);font-size:.92rem}
.fg{display:grid;gap:22px}.ft h4{margin:0 0 8px;color:var(--gold);font:700 .78rem var(--sans);letter-spacing:.12em;text-transform:uppercase}
.ft button{display:block;background:none;border:0;color:inherit;font:inherit;padding:5px 0;cursor:pointer;opacity:.85;text-align:left}.ft p.c{text-align:center;opacity:.7;margin-top:22px;font-size:.84rem}
.sk{position:sticky;bottom:8px;z-index:8;display:flex;gap:8px;padding:0 10px}.sk .btn{flex:1;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.pg{display:none}
@container (min-width:700px){
 .w{padding:0 34px}.nav{display:flex}.mt{display:none}.mn{display:none!important}
 .hero .w{grid-template-columns:1.1fr .9fr;align-items:center}.art{height:340px;max-width:500px}
 .grid{grid-template-columns:1fr 1fr}.card{flex-direction:column}.thumb{width:100%;height:190px;border-radius:18px}.thumb svg{width:52px;height:52px}.rings{grid-template-columns:repeat(3,1fr)}
 .steps{grid-template-columns:repeat(3,1fr);gap:24px}.st{grid-template-columns:1fr}
 .team{grid-template-columns:repeat(4,1fr)}.cols{grid-template-columns:1fr 1fr}.fg{grid-template-columns:repeat(3,1fr)}
 .p3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.p3 .price{margin:0}
 .ph.ip{padding:48px 0 56px}.ph.ip .w{grid-template-columns:1fr 320px;gap:40px;align-items:center}.ph.ip .pic{width:100%}.list{grid-template-columns:1fr 1fr}.job{grid-template-columns:1fr auto;align-items:center}
}
@container (min-width:1040px){
 .sec{padding:84px 0}.ph{padding:56px 0 64px}.ph.ip{padding:76px 0 84px}.ph.ip .w{grid-template-columns:1fr 420px;gap:80px}.ph.ip h1{font-size:clamp(2.8rem,5.2cqi,4.2rem)}.hero{padding-top:64px}.hero .w{gap:56px}.art{height:380px;max-width:540px}
 .g4{grid-template-columns:repeat(4,1fr)}.g4 .card{flex-direction:column}.g4 .thumb{width:100%;height:150px;border-radius:18px}.g4 .thumb svg{width:48px;height:48px}
 .two{display:grid;grid-template-columns:1fr 380px;gap:56px;align-items:start}.two aside{position:sticky;top:84px}
 .cols.c1{grid-template-columns:1.1fr .9fr;gap:60px}.sk{display:none}
}
</style>
</head>
