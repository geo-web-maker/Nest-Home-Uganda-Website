name: android-release

# Builds a signed release APK, uploads it to private storage, and publishes the
# release record via the admin API. Trigger by pushing a tag: nurse-v1.2.3
on:
  push:
    tags:
      - 'nurse-v*'

permissions:
  contents: read

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NURSE_VERSION_CODE: ${{ github.run_number }}
    defaults:
      run:
        working-directory: nurse

    steps:
      - uses: actions/checkout@v4

      - name: Take the version from the tag
        # nurse-v2.0.0 builds app 2.0.0. The number is chosen by the backend (next whole number
        # after the last PUBLISHED Android app), so a build that fails keeps its number for the retry.
        run: |
          VERSION="${GITHUB_REF_NAME#nurse-v}"
          echo "$VERSION" | grep -Eq '^[0-9]+\.0\.0$' || { echo "Tag ${GITHUB_REF_NAME} must look like nurse-v2.0.0"; exit 1; }
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Require lockfile
        run: test -f package-lock.json || { echo "nurse/package-lock.json missing"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nurse/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_MAIL_STORAGE_URL: ${{ vars.VITE_MAIL_STORAGE_URL }}
          # Push is switched on only when the Firebase file secret exists, so a build without it never crashes.
          VITE_PUSH_ENABLED: ${{ secrets.NURSE_GOOGLE_SERVICES_JSON_BASE64 != '' && 'true' || '' }}

      - name: Decode keystore
        run: |
          echo "${{ secrets.NURSE_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.jks

      - name: Generate native project
        run: npx cap add android

      - name: Apply Android overrides
        working-directory: .
        run: node scripts/apply_android_overrides.mjs

      - name: Add Firebase config (push notifications)
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.NURSE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_B64" ]; then
            echo "No NURSE_GOOGLE_SERVICES_JSON_BASE64 secret: building WITHOUT push notifications."
            exit 0
          fi
          mkdir -p android/app
          OUT=android/app/google-services.json
          # Accept either the raw JSON text or its base64, and ignore stray quotes, spaces and line breaks.
          CLEAN=$(printf '%s' "$GOOGLE_SERVICES_B64" | tr -d '\r\n\t "')
          case "$CLEAN" in
            \{*) printf '%s' "$GOOGLE_SERVICES_B64" > "$OUT" ;;
            *) printf '%s' "$CLEAN" | base64 -d > "$OUT" 2>/dev/null \
                 || { echo "NURSE_GOOGLE_SERVICES_JSON_BASE64 is neither valid JSON nor valid base64. Re-save it (see README)."; rm -f "$OUT"; exit 1; } ;;
          esac
          # The file must be valid JSON and belong to this app, otherwise push silently never arrives.
          PKG="ug.nesthomecare.nurse" python3 - <<'PY' || { rm -f "$OUT"; exit 1; }
          import json, os, sys
          try:
              data = json.load(open("android/app/google-services.json"))
          except Exception as e:
              sys.exit("google-services.json is not valid JSON: %s" % e)
          pkgs = [c.get("client_info", {}).get("android_client_info", {}).get("package_name") for c in data.get("client", [])]
          want = os.environ["PKG"]
          if want not in pkgs:
              sys.exit("google-services.json is for %s, but this build is %s" % (pkgs, want))
          print("google-services.json OK for", want)
          PY
          echo "Firebase config installed: push notifications enabled."

      - run: npx cap sync android

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        working-directory: nurse/android
        env:
          KEYSTORE_PATH: /tmp/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.NURSE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NURSE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NURSE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --no-daemon --stacktrace

      - name: Collect APK info
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          SIZE=$(stat -c%s "$APK")
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          VERSION="${APP_VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK to private bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET }}
          AWS_DEFAULT_REGION: ${{ secrets.S3_REGION }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET_PRIVATE: ${{ secrets.S3_BUCKET_PRIVATE }}
        run: |
          APK_KEY="apks/nurse-v${{ steps.apk.outputs.version }}-${{ github.run_number }}.apk"
          aws s3 cp "${{ steps.apk.outputs.path }}" \
            "s3://${S3_BUCKET_PRIVATE}/${APK_KEY}" \
            --endpoint-url "${S3_ENDPOINT}" \
            --content-type "application/vnd.android.package-archive"
          echo "APK_KEY=${APK_KEY}" >> "$GITHUB_ENV"

      - name: Publish release record
        env:
          ADMIN_API_URL: ${{ secrets.ADMIN_API_URL }}
          RELEASE_PUBLISH_KEY: ${{ secrets.RELEASE_PUBLISH_KEY }}
        run: |
          TAG="${{ github.ref_name }}"          # nurse-v1.2.3
          RELEASE_ID="android-${TAG}"
          curl -sf -X POST "${ADMIN_API_URL}/app-bundles/releases" \
            -H "X-Release-Key: ${RELEASE_PUBLISH_KEY}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg id "$RELEASE_ID" \
              --arg version "${{ steps.apk.outputs.version }}" \
              --argjson vc "${{ env.NURSE_VERSION_CODE }}" \
              --arg min "${{ steps.apk.outputs.version }}" \
              --arg key "$APK_KEY" \
              --arg sha "${{ steps.apk.outputs.sha256 }}" \
              --argjson sz "${{ steps.apk.outputs.size }}" \
              '{id:$id,platform:"android",version:$version,version_code:$vc,
                min_supported_version:$min,apk_key:$key,sha256:$sha,size_bytes:$sz}')"

      - name: Clean up keystore
        if: always()
        run: rm -f /tmp/release.jks
