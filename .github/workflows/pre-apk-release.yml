name: Pre-APK Release Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-apk-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            nurse/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -e '.[dev]'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install nurse dependencies
        working-directory: nurse
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright browsers for nurse
        working-directory: nurse
        run: npx playwright install --with-deps chromium

      - name: Run complete pre-APK release gate
        run: node scripts/pre-apk-release.mjs
