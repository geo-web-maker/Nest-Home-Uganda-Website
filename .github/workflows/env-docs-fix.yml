name: care-environment-docs

# Regenerates .env.example and docs/ENV_CARE_VARS.md from backend/app/core/config.py and commits them
# when they changed (ci.yml's ops-scripts job fails on drift). The original used a flow mapping with
# `${{ }}` inside braces, which is invalid YAML; block style below.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, nurse-module]

permissions:
  contents: write
  actions: write

jobs:
  regenerate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/gen_env_docs.py
      - name: Commit regenerated docs when changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git diff --quiet -- .env.example docs/ENV_CARE_VARS.md; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .env.example docs/ENV_CARE_VARS.md
            git commit -m 'docs: regenerate care environment variables'
            git pull --rebase
            git push
            if [ "${{ github.event_name }}" != "pull_request" ]; then gh workflow run ci.yml --ref "${{ github.ref_name }}"; fi
          fi
