name: ci
on:
  workflow_dispatch:
  push:
    branches: [main, "batch-*", "nurse-module"]
  pull_request:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No .env or dependency folders tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env$|node_modules|\.venv'; then echo "tracked file that must not be tracked"; exit 1; fi
      - name: Motor must not be used
        run: |
          if grep -rniE "^motor==|import motor|from motor" backend --include=*.py --include=*.lock --include=*.toml; then echo "Motor is forbidden (Beanie 2 uses PyMongo async)"; exit 1; fi
      - name: Firebase is limited to approved push integration files
        run: |
          if git grep -nEi 'firebase|googleapis.com/oauth2|fcm.googleapis.com' -- '*.py' '*.ts' '*.tsx' '*.js' '*.mjs' ':!backend/app/modules/push/**' ':!nurse/src/platform/push.ts' ':!frontend/src/admin-native/push.ts' ':!docs/**' ':!reference/**' ':!.github/workflows/**' ':!.env.example'; then echo 'push provider code is outside the approved integration files'; exit 1; fi
      - name: No remote fonts or CDN URLs
        run: |
          if git grep -nE 'fonts\.(googleapis|gstatic)\.com|unpkg\.com|cdn\.jsdelivr\.net' -- ':!docs/**' ':!reference/**'; then echo "remote font or CDN dependency is forbidden"; exit 1; fi
      - name: No Google-hosted CSS
        run: |
          if git grep -nEi 'googleapis\.com/css|fonts\.googleapis\.com' -- ':!docs/**' ':!reference/**'; then echo "Google-hosted CSS or fonts are forbidden"; exit 1; fi
      - name: No roles in code (scope model only)
        run: |
          if grep -rnE "require_roles|user_role|UserRole" backend/app frontend/src; then echo "roles are forbidden, use scopes"; exit 1; fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run build:admin-native
      - run: npm run format:check

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval "db.runCommand({ping:1})" && break || sleep 2; done
          docker exec mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})"
          sleep 5
      - run: pip install -r requirements.lock
      - run: pip install -e . --no-deps
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q -rs
      - name: Migrations and seed run against the real database (smoke test)
        env:
          MONGODB_URI: ${{ env.TEST_MONGODB_URI }}
          MONGODB_DB: nhc_ci_smoke
          SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
          FIRST_SUPERADMIN_EMAIL: ci@example.com
          FIRST_SUPERADMIN_PASSWORD: ci-dummy-password-123
        run: |
          python -m app.migrate
          python -m app.migrate
          python -m app.seed
          python -m app.seed

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Detect Playwright tests
        id: detect
        working-directory: .
        run: |
          if [ -d frontend/e2e ] && [ -n "$(ls -A frontend/e2e)" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No frontend/e2e yet, skipping"; fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.detect.outputs.present == 'true'
        run: npm ci
      - if: steps.detect.outputs.present == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.detect.outputs.present == 'true'
        run: npm run build
      - if: steps.detect.outputs.present == 'true'
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always() && steps.detect.outputs.present == 'true'
        with:
          name: playwright-screenshots
          path: |
            frontend/test-results
            frontend/playwright-report

  ops-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install shellcheck-py
      - name: Check owner-run scripts and environment docs
        run: |
          bash -n scripts/backup-mongodb-to-b2.sh
          bash -n scripts/restore-mongodb-from-b2.sh
          shellcheck scripts/backup-mongodb-to-b2.sh scripts/restore-mongodb-from-b2.sh
          python scripts/gen_env_docs.py --check

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the backend image (not pushed)
        run: docker build --tag nest-home-care-api:ci backend
      - name: The image starts and /health answers without a database
        run: |
          docker run -d --name api -p 8000:8000 -e SCHEDULER_ENABLED=false --entrypoint sh nest-home-care-api:ci \
            -c "python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
          for i in $(seq 1 20); do curl -s -o /dev/null http://127.0.0.1:8000/api/v1/health && break || sleep 2; done
          curl -s -i http://127.0.0.1:8000/api/v1/health | head -n 1
          docker logs api | tail -n 20
