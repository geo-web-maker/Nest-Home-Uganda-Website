name: admin-android-release

# Builds a signed release APK, uploads it to private storage, and publishes the
# release record via the admin API. Trigger by pushing a tag: admin-v1.2.3 (full APK; website-only changes use web-bundle-release)
on:
  push:
    tags:
      - 'admin-v*'

permissions:
  contents: read

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ADMIN_VERSION_CODE: ${{ github.run_number }}
    defaults:
      run:
        working-directory: admin

    steps:
      - uses: actions/checkout@v4

      - name: Take the version from the tag
        # admin-v2.0.0 builds app 2.0.0. The number is chosen by the backend (next whole number
        # after the last PUBLISHED Android app), so a build that fails keeps its number for the retry.
        run: |
          VERSION="${GITHUB_REF_NAME#admin-v}"
          echo "$VERSION" | grep -Eq '^[0-9]+\.0\.0$' || { echo "Tag ${GITHUB_REF_NAME} must look like admin-v2.0.0"; exit 1; }
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Require lockfile
        run: test -f package-lock.json || { echo "admin/package-lock.json missing"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_MAIL_STORAGE_URL: ${{ vars.VITE_MAIL_STORAGE_URL }}
          # Push is switched on only when the Firebase file secret exists, so a build without it never crashes.
          VITE_PUSH_ENABLED: ${{ secrets.ADMIN_GOOGLE_SERVICES_JSON_BASE64 != '' && 'true' || '' }}

      - name: Decode keystore
        run: |
          echo "${{ secrets.ADMIN_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.jks

      - name: Generate native project
        run: npx cap add android

      - name: Apply Android overrides
        working-directory: .
        run: node scripts/apply_admin_android_overrides.mjs

      - name: Add Firebase config (push notifications)
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.ADMIN_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_B64" ]; then
            echo "No ADMIN_GOOGLE_SERVICES_JSON_BASE64 secret: building WITHOUT push notifications."
            exit 0
          fi
          mkdir -p android/app
          PKG="ug.nesthomecare.admin" SECRET_NAME="ADMIN_GOOGLE_SERVICES_JSON_BASE64" python3 - <<'PY'
          import base64, json, os, re, sys
          name, want = os.environ["SECRET_NAME"], os.environ["PKG"]
          raw = os.environ["GOOGLE_SERVICES_B64"]

          def as_text(data):
              if data[:2] in (b"\xff\xfe", b"\xfe\xff"):
                  return data.decode("utf-16")
              return data.decode("utf-8-sig")

          def clean(s):
              return s.replace("\ufeff", "").strip().strip("\"'").strip()

          def try_b64(s):
              compact = re.sub(r"\s+", "", s)
              compact += "=" * (-len(compact) % 4)
              for decode in (base64.b64decode, base64.urlsafe_b64decode):
                  try:
                      return as_text(decode(compact))
                  except Exception:
                      pass
              return None

          text = clean(raw)
          for _ in range(3):  # raw JSON, base64, or base64 of base64
              if text.startswith("{"):
                  break
              decoded = try_b64(text)
              if decoded is None:
                  break
              text = clean(decoded)
          try:
              data = json.loads(text)
          except Exception:
              # Safe hint only: length and the first characters' codes, never the content.
              first = [hex(ord(c)) for c in raw[:4]]
              sys.exit("%s is not a Firebase google-services.json (neither JSON nor base64 of it). "
                       "Length %d, first characters %s. Open the downloaded file, select all, and paste its full contents "
                       "as the secret value." % (name, len(raw), first))
          pkgs = [c.get("client_info", {}).get("android_client_info", {}).get("package_name") for c in data.get("client", [])]
          if want not in pkgs:
              sys.exit("The Firebase file in %s is for %s, but this build is %s. Download the file for %s." % (name, pkgs, want, want))
          with open("android/app/google-services.json", "w") as f:
              json.dump(data, f, indent=2)
          print("google-services.json OK for", want)
          PY
          echo "Firebase config installed: push notifications enabled."

      - run: npx cap sync android

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        working-directory: admin/android
        env:
          KEYSTORE_PATH: /tmp/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ADMIN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ADMIN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ADMIN_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --no-daemon --stacktrace

      - name: Collect APK info
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          SIZE=$(stat -c%s "$APK")
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          VERSION="${APP_VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK to private bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET }}
          AWS_DEFAULT_REGION: ${{ secrets.S3_REGION }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET_PRIVATE: ${{ secrets.S3_BUCKET_PRIVATE }}
        run: |
          APK_KEY="apks/admin-v${{ steps.apk.outputs.version }}-${{ github.run_number }}.apk"
          aws s3 cp "${{ steps.apk.outputs.path }}" \
            "s3://${S3_BUCKET_PRIVATE}/${APK_KEY}" \
            --endpoint-url "${S3_ENDPOINT}" \
            --content-type "application/vnd.android.package-archive"
          echo "APK_KEY=${APK_KEY}" >> "$GITHUB_ENV"

      - name: Publish release record
        env:
          ADMIN_API_URL: ${{ secrets.ADMIN_API_URL }}
          RELEASE_PUBLISH_KEY: ${{ secrets.RELEASE_PUBLISH_KEY }}
        run: |
          TAG="${{ github.ref_name }}"          # admin-v1.2.3
          RELEASE_ID="android-${TAG}"
          curl -sf -X POST "${ADMIN_API_URL}/app-bundles/releases" \
            -H "X-Release-Key: ${RELEASE_PUBLISH_KEY}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg id "$RELEASE_ID" \
              --arg version "${{ steps.apk.outputs.version }}" \
              --argjson vc "${{ env.ADMIN_VERSION_CODE }}" \
              --arg min "${{ steps.apk.outputs.version }}" \
              --arg key "$APK_KEY" \
              --arg sha "${{ steps.apk.outputs.sha256 }}" \
              --argjson sz "${{ steps.apk.outputs.size }}" \
              '{id:$id,platform:"android",app:"admin",version:$version,version_code:$vc,
                min_supported_version:$min,apk_key:$key,sha256:$sha,size_bytes:$sz}')"

      - name: Clean up keystore
        if: always()
        run: rm -f /tmp/release.jks
