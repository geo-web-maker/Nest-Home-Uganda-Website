name: regenerate-api-types

# Regenerates frontend/src/types/openapi.json and api.d.ts from the backend app and commits them when
# they changed. gen-types.sh imports the FastAPI app, so Python and the backend dependencies are needed.
# Commits made with GITHUB_TOKEN do not start other workflows: re-run `ci` after this one commits.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, nurse-module]
    paths:
      - backend/app/**
      - backend/requirements.lock
      - scripts/gen-types.sh

permissions:
  contents: write
  actions: write

concurrency:
  group: regenerate-api-types-${{ github.ref }}
  cancel-in-progress: false

jobs:
  types:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies (the generator imports the app)
        working-directory: backend
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps
      - run: npm ci
        working-directory: frontend
      - run: bash scripts/gen-types.sh
      - name: Commit generated types when changed
        id: commit
        run: |
          if ! git diff --quiet -- frontend/src/types/openapi.json frontend/src/types/api.d.ts; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add frontend/src/types/openapi.json frontend/src/types/api.d.ts
            git commit -m 'chore: regenerate API types'
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Re-run CI on the new commit
        if: steps.commit.outputs.changed == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref "${{ github.ref_name }}"
