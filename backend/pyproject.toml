[project]
name = "nest-home-care-backend"
version = "0.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.146.0",
  "uvicorn[standard]==0.54.0",
  "beanie==2.2.0",
  "pymongo==4.19.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
  "email-validator==2.3.0",
  "argon2-cffi==25.1.0",
  "pyjwt==2.15.1",
  "apscheduler==3.11.3",
  "boto3==1.43.114",
  "python-multipart==0.0.32",
  "httpx==0.28.1",
  "pywebpush==2.3.0",
  "asyncpg==0.31.0",
  "cryptography==46.0.3",
  "aiosmtplib==5.1.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.17.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

# The migrations remain in backend/mail_migrations in source control and are also
# installed beside site-packages when the backend is built as a wheel.
[tool.setuptools.data-files]
"mail_migrations" = ["mail_migrations/*.sql"]

[tool.setuptools.package-data]
"app.modules.mail" = ["html_policy.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 100
extend-exclude = [".venv-local"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Cookie", "app.core.deps.require_scopes"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"app/seed.py" = ["T201"]
