# Render blueprint for the backend API. Secrets are `sync: false`: set them in the Render dashboard
# (names and meanings are in docs/ENV_VARS.md and docs/ENV_CARE_VARS.md). The frontend is on Vercel and
# MongoDB is on Atlas, so neither appears here.
services:
  - type: web
    name: nest-home-care-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass   # deploy only after the GitHub checks pass
    envVars:
      - key: APP_ENV
        value: production
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        sync: false
      - key: CARE_MONGODB_URI
        sync: false
      - key: CARE_MONGODB_DB
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: IP_HASH_SALT
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FIRST_SUPERADMIN_EMAIL
        sync: false
      - key: FIRST_SUPERADMIN_PASSWORD
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET_PUBLIC
        sync: false
      - key: S3_BUCKET_PRIVATE
        sync: false
      - key: S3_KEY
        sync: false
      - key: S3_SECRET
        sync: false
      - key: SMS_PROVIDER
        value: mambosms
      - key: MAMBOSMS_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: PUSH_SENDER
        value: fake            # change to the real sender only after Firebase secrets are set
      - key: FCM_PROJECT_ID
        sync: false
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
